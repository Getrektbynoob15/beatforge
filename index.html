<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; connect-src data: blob:; media-src data: blob:">
  <title>BeatForge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">◆</span> BeatForge</div>
    <nav class="menus" aria-label="Menus">
      <button class="menu-btn" id="menuFile" aria-haspopup="menu">File</button>
      <button class="menu-btn" id="menuEdit" aria-haspopup="menu">Edit</button>
      <button class="menu-btn" id="menuView" aria-haspopup="menu">View</button>
      <button class="menu-btn" id="menuHelp" aria-haspopup="menu">Help</button>
    </nav>

    <div class="transport" role="group" aria-label="Transport">
      <div class="seg" role="radiogroup" aria-label="Play mode (L)">
        <button id="modePattern" role="radio" aria-checked="true" class="seg-btn on" title="Pattern mode: loop the current pattern (L)">PAT</button>
        <button id="modeSong" role="radio" aria-checked="false" class="seg-btn" title="Song mode: play the playlist (L)">SONG</button>
      </div>
      <button id="playBtn" class="btn accent play" aria-keyshortcuts="Space" title="Play / Stop (Space)">▶</button>
      <button id="stopBtn" class="btn" title="Stop and go back to the start">■</button>
      <label class="field">BPM
        <input id="bpm" type="number" min="40" max="300" step="0.1" value="130" aria-label="Tempo in beats per minute">
      </label>
      <div class="time" aria-label="Position (bar.beat.step)"><span id="posText">1.1.1</span></div>
      <label class="field pat-field">Pattern
        <select id="patSelect" aria-label="Current pattern (numpad + and -)"></select>
      </label>
    </div>

    <div class="winbtns" role="group" aria-label="Windows">
      <button class="btn small" data-open="playlist" title="Playlist (F5)">Playlist <kbd>F5</kbd></button>
      <button class="btn small" data-open="rack" title="Channel rack (F6)">Channel rack <kbd>F6</kbd></button>
      <button class="btn small" data-open="piano" title="Piano roll (F7)">Piano roll <kbd>F7</kbd></button>
      <button class="btn small" data-open="mixer" title="Mixer (F9)">Mixer <kbd>F9</kbd></button>
    </div>
    <div class="undo">
      <button id="undoBtn" class="btn small icon" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
      <button id="redoBtn" class="btn small icon" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
    </div>
  </header>

  <main id="workspace" class="workspace" aria-label="Workspace"></main>

  <input id="openInput" type="file" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="busy" class="busy" hidden><div class="busy-box" role="alert"><span class="spinner" aria-hidden="true"></span> <span id="busyText">Working…</span></div></div>
  <dialog id="helpDlg" class="dlg" aria-labelledby="helpTitle">
    <h2 id="helpTitle">Keyboard shortcuts</h2>
    <div id="helpBody"></div>
    <form method="dialog"><button class="btn accent">Close</button></form>
  </dialog>

  <script src="js/plugins/registry.js"></script>
  <script src="js/synth.js"></script>
  <script src="js/plugins/instruments.js"></script>
  <script src="js/plugins/effects.js"></script>
  <script src="js/state.js"></script>
  <script src="js/wav.js"></script>
  <script src="js/stretch.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/ui/knob.js"></script>
  <script src="js/ui/menu.js"></script>
  <script src="js/ui/windows.js"></script>
  <script src="js/patterns.js"></script>
  <script src="js/channelrack.js"></script>
  <script src="js/pianoroll.js"></script>
  <script src="js/playlist.js"></script>
  <script src="js/mixer.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/io.js"></script>
  <script src="app.js"></script>
</body>
</html>
